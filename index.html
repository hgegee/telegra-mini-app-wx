<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WERX — платформа заданий</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Rubik:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main>
    <header class="header">
      <div>
        <h1 class="brand">WERX</h1>
        <p class="brand-sub">платформа заданий</p>
      </div>
      <div class="balance-pill"><span>Баланс</span><b id="headerBalance">0 ₽</b></div>
    </header>
    <div id="view"></div>
  </main>

  <nav class="nav">
    <div class="nav-inner">
      <button data-tab="tasks" class="active"><i data-lucide="pen-line"></i>Задания</button>
      <button data-tab="profile"><i data-lucide="user"></i>Профиль</button>
    </div>
  </nav>

  <div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>
