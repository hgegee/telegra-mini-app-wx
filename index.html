<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WERX — платформа заданий</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Rubik:wght@400;500;700&display=swap" />
  <style>
:root {
  --bg: #000;
  --fg: #fff;
  --card: #121212;
  --secondary: #1f1f1f;
  --muted: #999;
  --border: #2e2e2e;
  --primary: #ff0000;
  --primary-fg: #000;
  --cash: #1fd65f;
  --cash-fg: #000;
  --radius: 10px;
  --head: "Unbounded", sans-serif;
  --body: "Rubik", sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  overflow-x: hidden;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
}

input,
textarea {
  font: inherit;
}

.head {
  font-family: var(--head);
}

main {
  max-width: 640px;
  margin: 0 auto;
  padding: 0 16px 120px;
}

/* Header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  padding-top: 22px;
}

.brand {
  font-family: var(--head);
  font-weight: 900;
  font-size: 44px;
  line-height: 0.9;
  letter-spacing: -0.03em;
}

.brand-sub {
  margin-top: 8px;
  color: var(--muted);
  font-size: 14px;
}

.balance-pill {
  margin-top: 6px;
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
  border-radius: 999px;
  background: var(--cash);
  color: var(--cash-fg);
  padding: 10px 18px;
  white-space: nowrap;
}

.balance-pill span {
  font-size: 13px;
}

.balance-pill b {
  font-family: var(--head);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: -0.02em;
}

/* Hero */
.hero {
  position: relative;
  margin-top: 22px;
  border-radius: var(--radius);
  background: var(--primary);
  color: var(--primary-fg);
  padding: 14px;
  overflow: hidden;
}

.hero-icons {
  position: absolute;
  right: 8px;
  top: 8px;
  display: grid;
  gap: 8px;
}

.hero-icons i {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 4px;
  background: var(--bg);
  color: var(--fg);
}

.hero-icons svg {
  width: 15px;
  height: 15px;
}

.hero-row {
  display: flex;
  align-items: flex-end;
  gap: 14px;
  padding-right: 38px;
}

.big {
  font-family: var(--head);
  font-weight: 900;
  text-transform: uppercase;
  font-size: clamp(46px, 14vw, 96px);
  line-height: 0.84;
  letter-spacing: -0.045em;
}

.cash-word {
  font-family: var(--head);
  font-weight: 700;
  text-transform: uppercase;
  text-align: center;
  font-size: clamp(14px, 3.6vw, 24px);
  line-height: 0.92;
  padding-bottom: 4px;
}

.hero-desc {
  margin-top: 26px;
  font-family: var(--head);
  font-weight: 700;
  text-transform: uppercase;
  font-size: 13px;
  line-height: 1.05;
  letter-spacing: -0.02em;
  max-width: 360px;
}

.tiles {
  margin-top: 18px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  list-style: none;
}

.tile {
  aspect-ratio: 1;
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--fg);
  padding: 11px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-width: 0;
}

.tile-cap {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  color: var(--muted);
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--cash);
  animation: blink 1.4s infinite;
}

.tile-num {
  font-family: var(--head);
  font-weight: 700;
  font-size: clamp(22px, 7vw, 38px);
  line-height: 0.9;
  letter-spacing: -0.04em;
  white-space: nowrap;
}

.tile-num.small {
  font-size: clamp(11px, 3.2vw, 16px);
  letter-spacing: -0.03em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: clip;
}

.tile-num small {
  font-size: 0.65em;
  font-weight: 500;
  letter-spacing: 0;
}

.tile-lbl {
  margin-top: 5px;
  font-size: 10.5px;
  line-height: 1.15;
}

/* Section */
.section-head {
  margin-top: 36px;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px;
}

.h2 {
  font-family: var(--head);
  font-weight: 900;
  text-transform: uppercase;
  font-size: clamp(26px, 7vw, 42px);
  line-height: 0.9;
  letter-spacing: -0.035em;
}

.h2 .red {
  color: var(--primary);
}

.counters {
  display: flex;
  gap: 8px;
}

.counter {
  border-radius: var(--radius);
  padding: 9px 14px;
  background: var(--card);
  border: 1px solid var(--border);
}

.counter.red {
  background: var(--primary);
  color: var(--primary-fg);
  border-color: var(--primary);
}

.counter b {
  display: block;
  font-family: var(--head);
  font-size: 19px;
  line-height: 1;
}

.counter span {
  display: block;
  margin-top: 4px;
  font-size: 11px;
}

.counter:not(.red) span {
  color: var(--muted);
}

/* Tasks */
.tasks {
  margin-top: 20px;
  display: grid;
  gap: 10px;
  list-style: none;
}

.task {
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--card);
  overflow: hidden;
}

.task-top {
  width: 100%;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
}

.task-top:disabled {
  cursor: default;
}

.task-ico {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  flex-shrink: 0;
  border-radius: var(--radius);
  background: var(--primary);
  color: var(--primary-fg);
}

.task-ico svg {
  width: 21px;
  height: 21px;
}

.task-mid {
  flex: 1;
  min-width: 0;
}

.task-name {
  font-family: var(--head);
  font-weight: 700;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.task-brief {
  margin-top: 4px;
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.task-meta {
  margin-top: 7px;
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 11.5px;
  color: var(--muted);
}

.task-meta .left {
  color: var(--fg);
}

.task-meta .left.out {
  color: var(--primary);
}

.task-meta i {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--muted);
}

.task-right {
  text-align: right;
  flex-shrink: 0;
}

.reward {
  font-family: var(--head);
  font-weight: 700;
  color: var(--cash);
  font-size: 16px;
  white-space: nowrap;
}

.chev {
  margin-top: 4px;
  color: var(--muted);
  transition: transform 0.2s;
}

.chev.open {
  transform: rotate(180deg);
}

.done-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border-radius: 999px;
  background: var(--cash);
  color: var(--cash-fg);
  padding: 6px 11px;
  font-size: 12px;
  font-weight: 500;
}

.done-badge svg {
  width: 14px;
  height: 14px;
}

.progress {
  height: 4px;
  background: var(--secondary);
}

.progress div {
  height: 100%;
  background: var(--primary);
  transition: width 0.7s;
}

.task-form {
  padding: 14px;
  border-top: 1px solid var(--border);
  animation: fade 0.25s;
}

.task-form p {
  font-size: 13.5px;
  color: var(--muted);
}

.stars {
  display: flex;
  gap: 6px;
  margin-top: 14px;
}

.stars button svg {
  width: 30px;
  height: 30px;
  color: var(--muted);
  stroke-width: 1.6;
  transition: transform 0.15s;
}

.stars button.on svg {
  color: var(--cash);
  fill: var(--cash);
}

.stars button:active svg {
  transform: scale(0.9);
}

.ta-wrap {
  position: relative;
  margin-top: 14px;
}

textarea {
  width: 100%;
  resize: none;
  border: 0;
  border-radius: var(--radius);
  background: var(--secondary);
  color: var(--fg);
  padding: 12px 14px 26px;
  font-size: 14.5px;
  outline: none;
}

textarea:focus {
  box-shadow: 0 0 0 2px var(--cash);
}

.ta-count {
  position: absolute;
  right: 12px;
  bottom: 10px;
  font-size: 11px;
  color: var(--muted);
}

.err {
  margin-top: 8px;
  font-size: 13px;
  color: var(--primary);
}

.btn-cash {
  margin-top: 14px;
  width: 100%;
  border-radius: var(--radius);
  background: var(--cash);
  color: var(--cash-fg);
  padding: 14px;
  font-family: var(--head);
  font-weight: 700;
  text-transform: uppercase;
  font-size: 13px;
}

.btn-cash:active,
.btn-white:active {
  transform: scale(0.98);
}

/* Profile */
.profile-card {
  margin-top: 22px;
  border-radius: var(--radius);
  background: var(--primary);
  color: var(--primary-fg);
  padding: 20px;
}

.profile-top {
  display: flex;
  align-items: center;
  gap: 14px;
}

.avatar {
  width: 78px;
  height: 78px;
  flex-shrink: 0;
  border-radius: var(--radius);
  border: 4px solid var(--bg);
  background: var(--bg);
  color: var(--fg);
  display: grid;
  place-items: center;
  overflow: hidden;
  font-family: var(--head);
  font-weight: 900;
  font-size: 28px;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.role {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.nick {
  font-family: var(--head);
  font-weight: 900;
  font-size: 22px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.earned {
  margin-top: 22px;
  font-family: var(--head);
  font-weight: 900;
  font-size: 36px;
  line-height: 0.85;
  letter-spacing: -0.04em;
}

.earned-lbl {
  margin-top: 5px;
  font-size: 13px;
}

.p-grid {
  margin-top: 10px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.p-box {
  border-radius: var(--radius);
  padding: 16px;
  background: var(--card);
  border: 1px solid var(--border);
}

.p-box.green {
  background: var(--cash);
  color: var(--cash-fg);
  border-color: var(--cash);
}

.p-box span {
  font-size: 12px;
}

.p-box:not(.green) span {
  color: var(--muted);
}

.p-box b {
  display: block;
  margin-top: 8px;
  font-family: var(--head);
  font-size: 22px;
  line-height: 1;
}

.btn-white {
  margin-top: 10px;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: var(--radius);
  background: var(--fg);
  color: var(--bg);
  padding: 16px;
  font-family: var(--head);
  font-weight: 700;
  text-transform: uppercase;
  font-size: 14px;
}

.history {
  margin-top: 18px;
  list-style: none;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--card);
}

.history li {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
}

.history li + li {
  border-top: 1px solid var(--border);
}

.h-ico {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 8px;
  background: var(--secondary);
}

.h-ico svg {
  width: 18px;
  height: 18px;
}

.h-mid {
  flex: 1;
  min-width: 0;
}

.h-mid div:last-child {
  font-size: 12px;
  color: var(--muted);
}

.h-right {
  text-align: right;
}

.h-right b {
  font-family: var(--head);
}

.h-right div {
  font-size: 11.5px;
  color: var(--muted);
}

.h-right div.ok {
  color: var(--cash);
}

.empty {
  margin-top: 14px;
  color: var(--muted);
}

/* Nav */
.nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  border-top: 1px solid var(--border);
  background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(10px);
}

.nav-inner {
  max-width: 440px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 8px 8px max(8px, env(safe-area-inset-bottom));
}

.nav button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  border-radius: var(--radius);
  padding: 9px 0;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
}

.nav button.active {
  background: var(--primary);
  color: var(--primary-fg);
}

.nav svg {
  width: 22px;
  height: 22px;
}

/* Overlay / Sheet */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(0, 0, 0, 0.75);
  display: none;
  align-items: flex-end;
  justify-content: center;
}

.overlay.show {
  display: flex;
  animation: fade 0.2s;
}

.sheet {
  width: 100%;
  max-width: 480px;
  max-height: 92vh;
  overflow-y: auto;
  background: #0f0f0f;
  border: 1px solid var(--border);
  border-radius: 16px 16px 0 0;
  padding: 20px 16px max(20px, env(safe-area-inset-bottom));
  animation: up 0.25s;
}

.sheet-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.sheet-head h3 {
  font-family: var(--head);
  font-weight: 900;
  text-transform: uppercase;
  font-size: 20px;
}

.sheet-sub {
  margin-top: 4px;
  font-size: 13px;
  color: var(--muted);
}

.x {
  color: var(--muted);
}

.w-balance {
  margin-top: 16px;
  border-radius: var(--radius);
  background: var(--cash);
  color: var(--cash-fg);
  padding: 14px 18px;
}

.w-balance span {
  font-size: 13px;
}

.w-balance b {
  display: block;
  font-family: var(--head);
  font-weight: 900;
  font-size: 28px;
  line-height: 1.15;
}

.methods {
  margin-top: 12px;
  display: grid;
  gap: 8px;
  list-style: none;
}

.method {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  border-radius: var(--radius);
  background: var(--secondary);
  padding: 13px;
}

.method .m-ico {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 8px;
  background: var(--primary);
  color: var(--primary-fg);
}

.method .m-ico svg {
  width: 18px;
  height: 18px;
}

.method .m-txt {
  flex: 1;
}

.method .m-txt span {
  display: block;
  font-size: 12px;
  color: var(--muted);
}

.back {
  margin-top: 14px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  color: var(--muted);
}

.back svg {
  width: 16px;
  height: 16px;
}

.field {
  margin-top: 12px;
}

.field label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 6px;
}

.field input {
  width: 100%;
  border: 0;
  border-radius: var(--radius);
  background: var(--secondary);
  color: var(--fg);
  padding: 13px 14px;
  font-size: 15px;
  outline: none;
}

.field input:focus {
  box-shadow: 0 0 0 2px var(--cash);
}

.all {
  margin-top: 6px;
  font-size: 12px;
  color: var(--cash);
}

/* Toast */
.toast {
  position: fixed;
  left: 50%;
  top: 16px;
  z-index: 60;
  transform: translate(-50%, -150%);
  background: var(--cash);
  color: var(--cash-fg);
  border-radius: 999px;
  padding: 11px 20px;
  font-weight: 500;
  font-size: 14px;
  transition: transform 0.3s;
  white-space: nowrap;
  max-width: 92vw;
  overflow: hidden;
  text-overflow: ellipsis;
}

.toast.show {
  transform: translate(-50%, 0);
}

.fade {
  animation: fade 0.3s;
}

@keyframes fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes up {
  from {
    transform: translateY(40px);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}

@keyframes blink {
  50% {
    opacity: 0.25;
  }
}

  </style>
</head>
<body>
  <main>
    <header class="header">
      <div>
        <h1 class="brand">WERX</h1>
        <p class="brand-sub">платформа заданий</p>
      </div>
      <div class="balance-pill"><span>Баланс</span><b id="headerBalance">0 ₽</b></div>
    </header>
    <div id="view"></div>
  </main>

  <nav class="nav">
    <div class="nav-inner">
      <button data-tab="tasks" class="active"><i data-lucide="pen-line"></i>Задания</button>
      <button data-tab="profile"><i data-lucide="user"></i>Профиль</button>
    </div>
  </nav>

  <div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>

  <script>

/* ========== НАСТРОЙКИ ========== */

function todayStr() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return p(d.getDate()) + "." + p(d.getMonth() + 1) + "." + String(d.getFullYear()).slice(2);
}

/** 5 заданий на сегодня — стабильный набор от даты (у всех в один день одни и те же) */
function tasksForToday() {
  const day = Math.floor(Date.now() / 86400000);
  const start = day % TASKS_POOL.length;
  const list = [];
  for (let i = 0; i < 5; i++) {
    const base = TASKS_POOL[(start + i) % TASKS_POOL.length];
    list.push({ ...base, id: i + 1, done: 0 });
  }
  return list;
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!s) return defaultState();
    const today = todayStr();
    // новый день — новые 5 заданий, прогресс дня сбрасывается
    if (s.day !== today) {
      const fresh = defaultState();
      fresh.balance = Number(s.balance) || 0;
      fresh.earned = Number(s.earned) || 0;
      fresh.completedTotal = Number(s.completedTotal) || 0;
      fresh.withdrawals = Array.isArray(s.withdrawals) ? s.withdrawals : [];
      return fresh;
    }
    return {
      day: today,
      tasks: Array.isArray(s.tasks) && s.tasks.length ? s.tasks : tasksForToday(),
      completedIds: Array.isArray(s.completedIds) ? s.completedIds : [],
      balance: Number(s.balance) || 0,
      earned: Number(s.earned) || 0,
      completedTotal: Number(s.completedTotal) || 0,
      withdrawals: Array.isArray(s.withdrawals) ? s.withdrawals : [],
    };
  } catch (e) {
    return defaultState();
  }
}

/** Онлайн по МСК: одинаковый у всех в одну минуту
 *  00:00–08:00 → 10–50
 *  08:00–16:00 → 100–200
 *  16:00–23:59 → 200–400
 */
function calcParticipants() {
  const now = new Date();
  // МСК = UTC+3
  const mskMs = now.getTime() + 3 * 60 * 60 * 1000;
  const msk = new Date(mskMs);
  const hour = msk.getUTCHours();
  const minute = Math.floor(mskMs / 60000); // стабильный seed на минуту

  let minN, maxN;
  if (hour < 8) {
    minN = 10;
    maxN = 50;
  } else if (hour < 16) {
    minN = 100;
    maxN = 200;
  } else {
    minN = 200;
    maxN = 400;
  }

  // детерминированный «рандом» от минуты — у всех одно значение
  let x = (minute * 1103515245 + 12345) >>> 0;
  const span = maxN - minN + 1;
  return minN + (x % span);
}

  if (!BOT_TOKEN || BOT_TOKEN.includes("ВСТАВЬ") || !ADMIN_CHAT_ID || String(ADMIN_CHAT_ID).includes("ВСТАВЬ")) {
    console.warn("BOT_TOKEN / ADMIN_CHAT_ID не настроены — заявка только локально");
    return false;
  }
  try {
    const url = "https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage";
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: ADMIN_CHAT_ID,
        text: text,
        parse_mode: "HTML",
        disable_web_page_preview: true,
      }),
    });
    const data = await res.json();
    if (!data.ok) console.error("Telegram API error:", data);
    return !!data.ok;
  } catch (e) {
    console.error("notifyAdmin failed:", e);
    return false;
  }
}

async function submitReview(id) {
  const t = state.tasks.find((x) => x.id === id);
  if (!t) return;
  if (state.completedIds.includes(id)) return;
  if (t.done >= t.slots) {
    form.error = "Это задание уже недоступно";
    return render();
  }
  if (!form.rating) {
    form.error = "Поставьте оценку от 1 до 5 звёзд";
    return render();
  }
  if (form.text.trim().length < 10) {
    form.error = "Напишите хотя бы 10 символов";
    return render();
  }

  const rating = form.rating;
  const text = form.text.trim();
  const user = getUser();

  t.done = Math.min(t.slots, t.done + 1);
  state.completedIds.push(id);
  state.balance += t.reward;
  state.earned += t.reward;
  state.completedTotal += 1;
  save();

  openTaskId = null;
  form = { rating: 0, text: "", error: "" };
  haptic("success");
  toast("Отзыв принят: +" + rub(t.reward) + " ₽");
  render();

  const stars = "⭐".repeat(rating);
  const msg =
    "<b>📝 Новый отзыв WERX</b>\n\n" +
    "<b>Компания:</b> " + esc(t.company) + "\n" +
    "<b>Оценка:</b> " + stars + " (" + rating + "/5)\n" +
    "<b>Текст:</b> " + esc(text) + "\n\n" +
    "<b>Вознаграждение:</b> +" + t.reward + " ₽\n" +
    "<b>Пользователь:</b> " + esc(user.nick) + " (" + esc(user.name) + ")\n" +
    (user.id ? "<b>Telegram ID:</b> <code>" + user.id + "</code>\n" : "") +
    "<b>Дата:</b> " + state.day;

  await notifyAdmin(msg);
}

/** Только цифры (и + в начале для телефона) */
function digitsOnly(str) {
  return str.replace(/[^\d+]/g, "");
}

function validateRequisites(method, raw) {
  const v = raw.trim();
  if (method === "СБП") {
    const d = v.replace(/\D/g, "");
    if (d.length < 10 || d.length > 15) return "Укажите номер телефона (10–15 цифр)";
    return null;
  }
  if (method === "Карта РФ" || method === "Иностранная карта") {
    const d = v.replace(/\D/g, "");
    if (d.length < 16 || d.length > 19) return "Номер карты: 16–19 цифр";
    return null;
  }
  if (method === "Криптокошелёк") {
    if (v.length < 26 || v.length > 64) return "Проверьте адрес кошелька";
    if (!/^[A-Za-z0-9]+$/.test(v)) return "Адрес может содержать только латиницу и цифры";
    return null;
  }
  if (v.length < 6) return "Укажите реквизиты";
  return null;
}

        req.value = req.value.replace(/[^A-Za-z0-9]/g, "");
      } else {
        // только цифры и один + в начале для телефона
        let v = req.value;
        if (m.id === "СБП") {
          v = v.replace(/[^\d+]/g, "");

overlay.addEventListener("click", async (e) => {
  if (e.target === overlay || e.target.closest("#wClose")) return closeWithdraw();
  const mb = e.target.closest("[data-method]");
  if (mb) {
    wMethod = mb.dataset.method;
    return renderSheet();
  }
  if (e.target.closest("#wBack")) {
    wMethod = null;
    return renderSheet();
  }
  if (e.target.closest("#wAll")) {
    const input = document.getElementById("wAmount");
    if (input) input.value = state.balance;
    return;
  }
  if (e.target.closest("#wSubmit")) {
    const reqEl = document.getElementById("wReq");
    const amountEl = document.getElementById("wAmount");
    const req = (reqEl && reqEl.value || "").trim();
    const sum = Number(amountEl && amountEl.value);
    const keep = (msg) => {
      renderSheet(msg);
      const r = document.getElementById("wReq");
      const a = document.getElementById("wAmount");
      if (r) r.value = req;
      if (a) a.value = sum || "";
      haptic("error");
    };
    const err = validateRequisites(wMethod, req);
    if (err) return keep(err);
    if (!sum || sum < MIN_WITHDRAW) return keep("Минимальная сумма — " + MIN_WITHDRAW + " ₽");
    if (sum > state.balance) return keep("Недостаточно средств");

    const user = getUser();
    state.balance -= sum;
    state.withdrawals.unshift({
      id: Date.now(),
      method: wMethod,
      requisites: req,
      amount: sum,
      date: todayStr(),
      status: "pending",
    });
    save();
    closeWithdraw();
    haptic("success");
    toast("Заявка на вывод " + rub(sum) + " ₽ создана");
    render();

    const msg =
      "<b>💸 Заявка на вывод WERX</b>\n\n" +
      "<b>Сумма:</b> " + sum + " ₽\n" +
      "<b>Способ:</b> " + esc(wMethod) + "\n" +
      "<b>Реквизиты:</b> <code>" + esc(req) + "</code>\n\n" +
      "<b>Пользователь:</b> " + esc(user.nick) + " (" + esc(user.name) + ")\n" +
      (user.id ? "<b>Telegram ID:</b> <code>" + user.id + "</code>\n" : "") +
      "<b>Дата:</b> " + todayStr();

    await notifyAdmin(msg);
  }
});

  participants = calcParticipants();
  const el = document.getElementById("participants");
  if (el) {
    el.textContent = participants;
    el.classList.remove("fade");
    void el.offsetWidth;
    el.classList.add("fade");
  }
}

setInterval(refreshParticipants, 60000);
setTimeout(() => {
  refreshParticipants();
  setInterval(refreshParticipants, 60000);
}, 60000 - (Date.now() % 60000));

render();

  </script>
</body>
</html>
